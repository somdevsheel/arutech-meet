# Local development LiveKit SFU config. Production deployments should use a
# managed/clustered LiveKit config (Redis-backed node coordination, TURN, TLS) —
# see docs/deployment.md.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

# Required for Egress (recording) coordination: the egress worker is a SEPARATE
# service/container (see docker-compose.yml's `egress` service and egress.yaml)
# that talks to livekit-server via Redis pub/sub, not directly — without this,
# RoomCompositeEgress requests from the API (LiveKitService.startRoomRecording)
# will queue forever with no worker able to pick them up. See docs/webrtc.md.
redis:
  address: redis:6379

keys:
  devkey: change-me-livekit-secret-min-32-chars

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 100

webhook:
  api_key: devkey
  urls:
    - http://api:4000/api/v1/livekit/webhook

logging:
  level: info
