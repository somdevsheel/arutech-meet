# TLS-terminating reverse proxy for the single-instance Lightsail deployment
# (docs/deployment-lightsail.md). infrastructure/nginx/nginx.conf (the
# canonical one, used by docker-compose.yml's local --profile nginx and as the
# Kubernetes Ingress reference) deliberately does NOT terminate TLS itself —
# it assumes something in front of it does (a cloud LB / Ingress). A single
# Lightsail VM has nothing in front of it, so this variant does that job
# itself with a real Let's Encrypt certificate, on top of the same upstream/
# location structure as the canonical file. Kept as a separate file rather
# than adding an `if $lightsail` branch to the canonical one — nginx config
# conditionals are exactly the kind of fragile-to-review thing worth avoiding
# for a security-relevant file like this one.
#
# Bring the cert up first with certbot in webroot mode (see the deployment
# doc) — the plain-HTTP server block below serves the ACME challenge from the
# same webroot certbot writes into, so issuance/renewal never needs to stop
# nginx or open a second listener.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
    '"status":$status,"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
    '"request_id":"$request_id","http_referer":"$http_referer","http_user_agent":"$http_user_agent"}';
  access_log /dev/stdout json_combined;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream web_upstream {
    least_conn;
    server web:3000;
    keepalive 32;
  }

  upstream api_upstream {
    least_conn;
    server api:4000;
    keepalive 32;
  }

  # Plain HTTP: only exists to serve ACME challenges and redirect everything
  # else to HTTPS. getUserMedia (camera/mic) refuses to run over plain HTTP on
  # anything but localhost, so real-device testing over the internet requires
  # this redirect to actually happen, not just be available.
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Paths matching the volume mount in docker-compose.lightsail.yml — see
    # docs/deployment-lightsail.md §TLS for how certbot populates these.
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    add_header X-Request-Id $request_id always;

    location = /health {
      proxy_pass http://api_upstream/health;
      proxy_set_header Host $host;
      access_log off;
    }

    location = /metrics {
      # Prometheus scrape only. On a single test instance there's usually no
      # scraper at all — this stays closed (deny all) rather than open to the
      # internet; loosen only if you actually wire up Prometheus against this
      # box specifically.
      deny all;
      proxy_pass http://api_upstream/metrics;
      proxy_set_header Host $host;
    }

    location = /docs {
      proxy_pass http://api_upstream/docs;
      proxy_set_header Host $host;
    }
    location /docs/ {
      proxy_pass http://api_upstream/docs/;
      proxy_set_header Host $host;
    }

    # Socket.IO (chat/presence/moderation) — not the WebRTC media path, see
    # docs/webrtc.md. Browsers reach LiveKit's TCP fallback (7881) and the
    # UDP media range directly; signaling (7880) is TLS-terminated by the
    # dedicated server block below, not through this one.
    location /socket.io/ {
      proxy_pass http://api_upstream/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/v1/auth/login {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location /api/v1/livekit/webhook {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # LiveKit signaling, TLS-terminated here — see docker-compose.lightsail.yml's
  # nginx service (port 7880 is published on nginx, not on the livekit
  # container) and NEXT_PUBLIC_LIVEKIT_URL / LIVEKIT_URL, both wss://$DOMAIN:7880.
  # A real cert is required because the web app is served over https, and a
  # secure page refuses to open an insecure (ws://) connection — LiveKit
  # itself has no cert configured, so this has to be the TLS boundary.
  # LiveKit's signaling protocol is plain HTTP/WebSocket underneath (RPC over
  # a WS upgrade, plus a few REST-ish paths), so a single catch-all
  # WS-upgrading proxy_pass at the root covers all of it — same pattern as
  # the /socket.io/ location above, just for the whole port instead of one path.
  server {
    listen 7880 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
      proxy_pass http://livekit:7880;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  # MinIO, TLS-terminated here, same reasoning and pattern as the LiveKit
  # block above — direct browser <-> object storage for presigned chat/
  # meeting attachment uploads and downloads (apps/api/src/storage,
  # apps/api/src/files). Object storage was previously only reachable at
  # `minio:9000` (S3_ENDPOINT/S3_PUBLIC_ENDPOINT both pointed there) — a
  # Docker-internal hostname no real browser can resolve, so every presigned
  # URL handed to a client failed outright; attachments/downloads never
  # worked from a real browser, only from inside the Docker network.
  #
  # This CANNOT be a path-based location under the main :443 server block
  # (e.g. `/storage/` proxying to `minio:9000/`) the way most other services
  # here are — AWS SigV4 signs the exact request path as part of the
  # signature (see StorageService's own doc comment), so nginx stripping or
  # rewriting any part of that path before it reaches MinIO invalidates the
  # signature and every upload/download 403s with SignatureDoesNotMatch
  # (confirmed directly against a real MinIO before writing this). A
  # dedicated port with a pure, path-preserving passthrough — nothing added
  # or stripped, identical to the LiveKit block above — is the only proxy
  # shape that keeps the signed path byte-for-byte identical end to end.
  # `$http_host` (not `$host`) is deliberate: it preserves the port a
  # non-default-port Host header actually carries, which the signature's
  # `SignedHeaders=host` depends on matching exactly.
  server {
    listen 9000 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;

    location / {
      proxy_pass http://minio:9000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
