# Production reverse proxy for Arutech Meet. Routes:
#   /              -> web (Next.js)
#   /api/          -> api (NestJS REST)
#   /socket.io/    -> api (Socket.IO — needs the WebSocket upgrade headers below)
#   /health, /metrics, /docs -> api, unprefixed (matches apps/api's setGlobalPrefix exclude list)
#
# LiveKit (SFU) media/signaling traffic does NOT go through this proxy — clients
# connect to it directly (see docs/webrtc.md); LiveKit has its own ingress/LB in
# front of it (typically a dedicated TCP/UDP load balancer, not this NGINX).
#
# This file is the reference used both by `docker-compose.yml`'s optional nginx
# service (local, self-signed-cert-friendly) and as the starting point for the
# production Ingress controller config (infrastructure/kubernetes/) — the two
# are not identical (Kubernetes terminates TLS at the Ingress and this becomes
# a plain-HTTP internal proxy), see the notes inline below.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
    '"status":$status,"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
    '"request_id":"$request_id","http_referer":"$http_referer","http_user_agent":"$http_user_agent"}';
  access_log /dev/stdout json_combined;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 50m; # file/attachment uploads — see docs/security.md §File uploads

  # Rate limiting is also enforced app-side (ThrottlerModule) — this is a coarser,
  # cheaper first line of defense against obvious abuse before it reaches Node.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream web_upstream {
    least_conn;
    server web:3000;
    # Add more `server web-N:3000;` lines (or a service-discovery-backed
    # resolver in Kubernetes) as the web tier scales horizontally.
    keepalive 32;
  }

  upstream api_upstream {
    least_conn;
    server api:4000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # In production this redirects to https; local dev (docker-compose) usually
    # terminates plain HTTP only, so this block is commented out there — see
    # docker-compose.yml's nginx service definition.
    # return 301 https://$host$request_uri;

    add_header X-Request-Id $request_id always;

    location = /health {
      proxy_pass http://api_upstream/health;
      proxy_set_header Host $host;
      access_log off;
    }

    location = /metrics {
      # Prometheus scrape only — restrict to the cluster's internal network in
      # production (this allow-list is a placeholder; replace with your actual
      # scraper CIDR, or don't expose this location externally at all).
      allow 10.0.0.0/8;
      deny all;
      proxy_pass http://api_upstream/metrics;
      proxy_set_header Host $host;
    }

    location = /docs {
      proxy_pass http://api_upstream/docs;
      proxy_set_header Host $host;
    }
    location /docs/ {
      proxy_pass http://api_upstream/docs/;
      proxy_set_header Host $host;
    }

    # WebSocket (Socket.IO — app-level chat/presence/moderation channel, see
    # docs/realtime.md). NOT the WebRTC media path — that's a direct
    # browser<->LiveKit connection, never proxied here.
    location /socket.io/ {
      proxy_pass http://api_upstream/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      # WebSocket connections are long-lived — don't let a default proxy
      # timeout silently drop idle-but-alive chat/presence connections.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/v1/auth/login {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    # LiveKit webhook — server-to-server from the LiveKit/Egress containers, not
    # a browser client. Excluded from the general rate-limit zone/burst above
    # since it's authenticated by LiveKit's webhook signature, not end-user
    # traffic, and should not be starved by unrelated user request bursts.
    location /api/v1/livekit/webhook {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      # Next.js dev-mode HMR also uses a WebSocket — harmless to always send
      # these upgrade headers even for plain HTTP requests.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
