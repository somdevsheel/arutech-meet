apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arutech-meet.fullname" . }}-web
  labels:
    {{- include "arutech-meet.labels" . | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "arutech-meet.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "web") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "arutech-meet.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "web") | nindent 8 }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/{{ .Values.image.webRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          # Next.js reads NODE_ENV at runtime for a few things beyond the
          # NEXT_PUBLIC_* bundle-time values (see configmap.yaml's comment on
          # why those specifically don't take effect here).
          envFrom:
            - configMapRef:
                name: {{ include "arutech-meet.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
