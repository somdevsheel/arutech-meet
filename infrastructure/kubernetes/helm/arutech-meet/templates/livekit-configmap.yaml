{{- if .Values.livekit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arutech-meet.fullname" . }}-livekit-config
  labels:
    {{- include "arutech-meet.labels" . | nindent 4 }}
data:
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50019
      use_external_ip: true
    redis:
      address: {{ .Values.livekit.redisAddress | default "REPLACE_ME:6379" | quote }}
    keys:
      {{ .Values.secrets.livekitApiKey }}: {{ .Values.secrets.livekitApiSecret | quote }}
    webhook:
      api_key: {{ .Values.secrets.livekitApiKey | quote }}
      urls:
        - "http://{{ include "arutech-meet.fullname" . }}-api/api/v1/livekit/webhook"
    logging:
      level: info
{{- end }}
