apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arutech-meet.fullname" . }}-secrets
  labels:
    {{- include "arutech-meet.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}
  COOKIE_SECRET: {{ .Values.secrets.cookieSecret | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  S3_ENDPOINT: {{ .Values.secrets.s3Endpoint | quote }}
  S3_PUBLIC_ENDPOINT: {{ .Values.secrets.s3PublicEndpoint | quote }}
  LIVEKIT_API_KEY: {{ .Values.secrets.livekitApiKey | quote }}
  LIVEKIT_API_SECRET: {{ .Values.secrets.livekitApiSecret | quote }}
  LIVEKIT_URL: {{ .Values.secrets.livekitUrl | quote }}
  LIVEKIT_HTTP_URL: {{ .Values.secrets.livekitHttpUrl | quote }}
  SENTRY_DSN: {{ .Values.secrets.sentryDsn | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.secrets.otelExporterOtlpEndpoint | quote }}
